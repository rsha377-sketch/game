<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#151d52">
  <title>Block Puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header class="hud">
      <div class="best">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>
        <div>
          <span class="lbl">Rekord</span>
          <strong id="best">0</strong>
        </div>
      </div>

      <div class="score">
        <span class="lbl">Ball</span>
        <strong id="score" aria-live="polite">0</strong>
      </div>

      <div class="actions">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Ovozni yoqish yoki o‘chirish" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="spk" d="M4 9v6h4l5 4V5L8 9H4z"/>
            <path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>
            <path class="slash" d="M4 4l16 16"/>
          </svg>
        </button>
        <button class="icon-btn" id="restartBtn" type="button" aria-label="Yangi o‘yin">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.7-6"/>
            <path d="M20 4v5h-5"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="stage">
      <div class="board" id="board" aria-label="O‘yin maydoni"></div>
      <div class="pops" id="pops"></div>
    </section>

    <section class="tray" id="tray" aria-label="Bloklar">
      <div class="slot" data-slot="0"></div>
      <div class="slot" data-slot="1"></div>
      <div class="slot" data-slot="2"></div>
    </section>

  </main>

  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="modal" id="gameOver" role="dialog" aria-modal="true" aria-labelledby="goTitle">
    <div class="card">
      <h2 id="goTitle">O‘yin tugadi</h2>
      <div class="badge" id="recordBadge">Yangi rekord!</div>
      <div class="result">
        <span class="lbl">Sizning ballingiz</span>
        <strong id="finalScore">0</strong>
      </div>
      <div class="result small">
        <span class="lbl">Rekord</span>
        <strong id="finalBest">0</strong>
      </div>
      <button class="primary" id="againBtn" type="button">Qayta o‘ynash</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
